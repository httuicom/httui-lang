# Builds the httui-lsp binary for each supported platform and publishes
# them as GitHub release assets named `httui-lsp-<target-triple>`.
# Downstream bundles (the desktop app) download these by pinned version.
#
# macOS x86_64 builds natively on the Intel runner — OCaml does not
# cross-compile between Apple architectures.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same cache rotation as ci.yml: setup-ocaml never re-saves an
      # exact-hit cache, so a stale snapshot forces a full compiler
      # rebuild on every run once opam-repository metadata drifts.
      - name: Compute opam cache key
        id: opam-cache-key
        shell: bash
        run: echo "prefix=v3-$(date -u +%Y-%m)-${{ hashFiles('**/*.opam') }}" >> "$GITHUB_OUTPUT"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          dune-cache: true
          cache-prefix: ${{ steps.opam-cache-key.outputs.prefix }}

      - name: Install dune
        run: opam install --yes dune

      - name: Install dependencies
        run: opam install . --deps-only

      - name: Build
        run: opam exec -- dune build --profile release

      - name: Stage binary
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          SUFFIX=""
          [[ "$TRIPLE" == *windows* ]] && SUFFIX=".exe"
          cp _build/default/bin/httui-lsp/httui_lsp.exe "httui-lsp-$TRIPLE$SUFFIX"
          # dune outputs are read-only and cp preserves the mode; strip
          # needs a writable file.
          chmod 755 "httui-lsp-$TRIPLE$SUFFIX"
          # GNU strip corrupts MSVC-linked PE binaries — Windows ships
          # unstripped.
          [[ "$TRIPLE" == *windows* ]] || strip "httui-lsp-$TRIPLE$SUFFIX"
          if [[ "$TRIPLE" == *windows* ]]; then
            # sqlite3 is linked dynamically; the Windows loader resolves
            # DLLs from the exe's directory, so the dll ships alongside
            # the binary (release asset + desktop bundle).
            DLL="$(find /usr -name 'libsqlite3-0.dll' 2>/dev/null | head -1)"
            if [[ -z "$DLL" ]]; then
              echo "error: libsqlite3-0.dll not found in the toolchain sysroot" >&2
              exit 1
            fi
            cp "$DLL" libsqlite3-0.dll
          fi

      # The server answers initialize and exits cleanly on stdin EOF; a
      # binary that fails to handshake must never reach the release.
      - name: Smoke test (initialize handshake)
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          SUFFIX=""
          if [[ "$TRIPLE" == *windows* ]]; then
            SUFFIX=".exe"
            # exit 127 here means the Windows loader could not find a
            # DLL; cygcheck names which ones the binary links against.
            cygcheck "./httui-lsp-$TRIPLE$SUFFIX" || true
          fi
          BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
          RESPONSE="$(printf "Content-Length: %d\r\n\r\n%s" "${#BODY}" "$BODY" \
            | "./httui-lsp-$TRIPLE$SUFFIX" || echo "SERVER_EXIT_$?")"
          echo "response: ${RESPONSE:0:300}"
          if [[ "$RESPONSE" == SERVER_EXIT_* ]]; then
            echo "retrying inside the opam environment:"
            printf "Content-Length: %d\r\n\r\n%s" "${#BODY}" "$BODY" \
              | opam exec -- "./httui-lsp-$TRIPLE$SUFFIX" | head -c 300 || true
            echo
          fi
          grep -q '"hoverProvider":true' <<<"$RESPONSE"

      - uses: actions/upload-artifact@v4
        with:
          name: httui-lsp-${{ matrix.triple }}
          # libsqlite3-0.dll only exists on the Windows runner; the
          # unmatched pattern elsewhere is a warning, not a failure.
          path: |
            httui-lsp-${{ matrix.triple }}*
            libsqlite3-0.dll
          if-no-files-found: error

  # CM6 first-paint grammars, consumed by the desktop as pinned
  # tarball URLs. Versions are synced to the tag so the asset names and
  # the package versions always match.
  lezer:
    name: Lezer package (${{ matrix.package }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        package: [lezer-httui-refs, lezer-httui-http]
    defaults:
      run:
        working-directory: grammars-lezer/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Sync version from tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Test
        run: npm test
      - name: Pack
        run: |
          npm run build
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-tarball
          path: grammars-lezer/${{ matrix.package }}/httui-lezer-*.tgz
          if-no-files-found: error

  # Single publish step after all builds so the release appears once,
  # complete — no partial asset lists from racing matrix jobs.
  publish:
    name: Publish release
    needs: [build, lezer]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/httui-lsp-* assets/*.dll assets/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "httui-lsp $GITHUB_REF_NAME" \
            --generate-notes
