name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ocaml:
    name: OCaml build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Install dune
        run: opam install --yes dune
      - name: Install dependencies
        run: opam install . --deps-only --with-test
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune runtest
      - name: Format check
        if: runner.os == 'Linux'
        run: |
          opam install --yes ocamlformat.0.28.1
          opam exec -- dune build @fmt

  lezer:
    name: Lezer grammar (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [lezer-httui-refs, lezer-httui-http]
    defaults:
      run:
        working-directory: grammars-lezer/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grammars-lezer/${{ matrix.package }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test (also generates parser)
        run: npm test
      - name: Build bundle
        run: npm run build

  tree-sitter:
    name: Tree-sitter grammar (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grammar: [tree-sitter-httui-refs, tree-sitter-httui-http]
    defaults:
      run:
        working-directory: lib/grammars/${{ matrix.grammar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Generate parser
        run: npx tree-sitter generate
      - name: Verify committed artifacts match regeneration
        run: |
          if ! git diff --exit-code src/parser.c src/grammar.json src/node-types.json; then
            echo "::error::Committed tree-sitter artifacts are out of sync with grammar.js. Run 'npx tree-sitter generate' and commit the result."
            exit 1
          fi
      - name: Run corpus tests
        run: npx tree-sitter test

  cross-grammar:
    name: Cross-grammar sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli
      - name: Build Lezer grammar packages
        working-directory: grammars-lezer
        run: |
          for pkg in lezer-httui-refs lezer-httui-http; do
            (cd "$pkg" && npm ci && npm run build)
          done
      - name: Run sync tests
        working-directory: cross-grammar-tests
        run: |
          npm ci
          npx vitest run

  commit-style:
    name: Commit style (subject only, conventional, no internal vocab)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commits on PR branch
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
          FAIL=0
          while read -r line; do
            SHA=$(echo "$line" | awk '{print $1}')
            SUBJ=$(echo "$line" | cut -d' ' -f2-)
            if [[ ${#SUBJ} -gt 72 ]]; then
              echo "::error::commit $SHA: subject exceeds 72 characters"
              FAIL=1
            fi
            if echo "$SUBJ" | grep -Eqi '\b(ADR-?[0-9]|RFC-?[0-9]|Slice[ -]?[0-9]|V[0-9]+\b|tui-V[0-9]|Phase[ -]?[0-9]|Fase[ -]?[0-9]|Vertical[ -]?[0-9]|Story[ -]?[0-9])'; then
              echo "::error::commit $SHA: subject contains internal planning vocabulary"
              FAIL=1
            fi
            if ! echo "$SUBJ" | grep -Eq '^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9_,-]+\))?(!)?: .+'; then
              echo "::error::commit $SHA: subject does not match conventional commits"
              FAIL=1
            fi
          done < <(git log --no-merges --format='%h %s' "${BASE_SHA}..HEAD")
          exit $FAIL
