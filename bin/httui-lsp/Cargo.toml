[package]
name = "httui-lsp"
description = "LSP server for httui — wraps the OCaml language layer and depends on httui-core for storage and execution"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["João Ferreira <joao@httui.com>"]
repository = "https://github.com/httuicom/httui-lang"
homepage = "https://httui.com"
documentation = "https://github.com/httuicom/httui-lang#readme"

[dependencies]
httui-core = { git = "https://github.com/httuicom/httui-core", rev = "aa8c44f65700933ba3e0d6476c038b5ef2f4ba9e" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
